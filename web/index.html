<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="L'application Ceticy vous permet de découvrir des restaurants et des bars qui vous ressemblent afin de les ajouter à votre liste de favoris. Partagez vos pépites à vos amis directement dans l’application et organisez votre sortie en toute simplicité.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ceticy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/favicon.png">

  <title>Application Ceticy</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer=""></script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
    }
  </script>
</head>

<body>
  <picture id="splash">
    <img class="center" aria-hidden="true" src="icons/favicon.png" alt="">
  </picture>

  <script>
    window.addEventListener("load", function (ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
            document.body.classList.add("app-loaded");
          });
        },
      });
    });
  </script>

  <style>
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      max-width: 200px;
    }

    body {
      background: #FF8200;
    }

    body.app-loaded {
      background: #111;
    }

    @media (prefers-color-scheme: light) {
      body.app-loaded {
        background: #eee;
      }
    }
  </style>
</body>

</html>
